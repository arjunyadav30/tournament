<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register with Mobile</title>
</head>
<body>
<h2>Player Registration</h2>
<div th:if="${param.error}">
    <p th:text="${param.error}"></p>
</div>
<form action="/public/register" method="post">
    <label>Name: <input type="text" name="playerName" required/></label><br/>
    <label>Mobile: <input type="text" name="mobile" pattern="[0-9]{10,15}" th:value="${mobile}" required/></label><br/>
    <button type="submit">Register</button>
</form>
<p>Or <a href="/public/otp">Login with OTP</a></p>
</body>
</html>
