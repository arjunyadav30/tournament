<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Verify OTP</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/auth.css}">
</head>
<body>
<div class="container">
    <h2>Enter OTP</h2>
    <div th:if="${param.error}"><p th:text="${param.error}"></p></div>
    <form action="/public/otp/verify" method="post" class="auth-form">
        <input type="hidden" name="mobile" th:value="${mobile}" />
        <label>OTP: <input type="text" name="code" pattern="[0-9]{6}" required/></label>
        <button type="submit">Verify</button>
    </form>
</div>
</body>
</html>
