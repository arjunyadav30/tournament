<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Send OTP</title>
</head>
<body>
<h2>Login / Register with OTP</h2>
<div th:if="${param.error}"><p th:text="${param.error}"></p></div>
<div th:if="${param.info}"><p th:text="${param.info}"></p></div>
<form action="/public/otp/send" method="post">
    <label>Mobile: <input type="text" name="mobile" pattern="\\d{10,15}" required/></label>
    <button type="submit">Send OTP</button>
</form>
<p>Or <a href="/public/register">Register with name</a></p>
</body>
</html>
