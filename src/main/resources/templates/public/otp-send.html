<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Send OTP</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/auth.css}">
</head>
<body>
<div class="container">
    <h2>Login / Register with OTP</h2>
    <div th:if="${param.error}"><p th:text="${param.error}"></p></div>
    <div th:if="${param.info}"><p th:text="${param.info}"></p></div>
    <form action="/public/otp/send" method="post" class="auth-form">
        <label>Mobile: <input type="text" name="mobile" pattern="[0-9]{10,15}" required/></label>
        <button type="submit">Send OTP</button>
    </form>
    <p>Or <a href="/public/register">Register with name</a></p>
</div>
</body>
</html>
